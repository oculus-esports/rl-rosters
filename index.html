<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OU Esports - Collegiate RL Roster & Scouting DB</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <!-- Top Navigation & Auth -->
        <header class="sticky-header">
          <div class="header-top">
            <h1>OU Esports - RL Scouting Database</h1>
            <div class="admin-auth">
              <span id="admin-status">Mode: Public Viewer</span>
              <button id="auth-btn" onclick="toggleAuthModal()">Team Login</button>
            </div>
          </div>
          <div class="filters">
            <input type="text" id="search-input" placeholder="Search by School, Player Name, or Alias..." onkeyup="renderAll()" autocomplete="off">
            <select id="sort-select" onchange="renderAll()">
              <option value="team">Group by: Team</option>
              <option value="peak">Sort Global: Peak MMR</option>
              <option value="3v3">Sort Global: 3v3 MMR</option>
              <option value="1v1">Sort Global: 1v1 MMR</option>
            </select>
          </div>
        </header>

        <!-- Login Modal / Form -->
        <div id="login-modal" class="card hidden">
            <h3>Admin Login</h3>
            <form style="display: flex; gap: 10px; margin-top: 10px; align-items: center;" autocomplete="off" onsubmit="event.preventDefault(); loginAdmin();">
                <input type="text" id="admin-email" placeholder="Username / Email" autocomplete="off">
                <input type="password" id="admin-password" placeholder="Password" autocomplete="new-password">
                <button type="submit">Sign In</button>
                <button type="button" onclick="toggleAuthModal()" style="background-color: #555;">Cancel</button>
            </form>
        </div>

        <!-- Admin Controls Panel -->
        <section id="admin-panel" class="card admin-only hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2>Admin Management Panel</h2>
            </div>
            
            <div class="form-grid">
                <!-- Add / Edit Team Form -->
                <div class="form-box">
                    <h3>Add New Team</h3>
                    <form id="addTeamForm" autocomplete="off" onsubmit="event.preventDefault(); saveTeam();" style="display: flex; flex-direction: column; gap: 10px;">
                        <input type="text" id="team-name-input" placeholder="School / Team Name (e.g. UT Austin)" required autocomplete="off">
                        <label style="font-size: 0.85rem; color: #9ba3b4;">Upload Team Logo:</label>
                        <input type="file" id="team-logo-file" accept="image/*">
                        <button type="submit" class="btn btn-primary">Save Team</button>
                    </form>
                </div>

                <!-- Add Player Card (MANUAL ONLY NOW) -->
                <div class="form-box">
                    <h3>Add Player to Roster</h3>
                    
                    <form id="addPlayerManualForm" autocomplete="off" onsubmit="addPlayerManualSubmit(event);" style="display: flex; flex-direction: column; gap: 10px;">
                        <input type="text" id="manualUsername" placeholder="Player GamerTag / Name" required autocomplete="off" />
                        
                        <!-- Searchable Team Droplist -->
                        <datalist id="teams-list"></datalist>
                        <input type="text" id="manualTeamInput" list="teams-list" placeholder="Type or Select Team..." required autocomplete="off" />
                        
                        <!-- 1v1 Grid -->
                        <label style="font-size: 0.8em; color: #aaa; margin-bottom: -5px;">RANKED DUEL 1V1</label>
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                            <input type="number" id="m1v1_cur" placeholder="Current MMR" autocomplete="off" />
                            <input type="number" id="m1v1_best" placeholder="Best MMR" autocomplete="off" />
                            <input type="number" id="m1v1_season" placeholder="Best Season (e.g. 15)" autocomplete="off" />
                        </div>

                        <!-- 2v2 Grid -->
                        <label style="font-size: 0.8em; color: #aaa; margin-bottom: -5px; margin-top: 5px;">RANKED DOUBLES 2V2</label>
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                            <input type="number" id="m2v2_cur" placeholder="Current MMR" autocomplete="off" />
                            <input type="number" id="m2v2_best" placeholder="Best MMR" autocomplete="off" />
                            <input type="number" id="m2v2_season" placeholder="Best Season" autocomplete="off" />
                        </div>

                        <!-- 3v3 Grid -->
                        <label style="font-size: 0.8em; color: #aaa; margin-bottom: -5px; margin-top: 5px;">RANKED STANDARD 3V3</label>
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                            <input type="number" id="m3v3_cur" placeholder="Current MMR" autocomplete="off" />
                            <input type="number" id="m3v3_best" placeholder="Best MMR" autocomplete="off" />
                            <input type="number" id="m3v3_season" placeholder="Best Season" autocomplete="off" />
                        </div>
                
                        <input type="url" id="manualTrackerUrl" placeholder="Tracker Profile URL (Optional)" autocomplete="off" style="margin-top: 5px;" />
                        <input type="text" id="manualAlias" placeholder="Player Alias/Other known names (Optional)" autocomplete="off" />
                        <input type="text" id="manualNotes" placeholder="Scouting Notes (Optional)" autocomplete="off" />
                        
                        <button type="submit" class="btn btn-primary" style="margin-top: 5px;">Save Player</button>
                    </form>
                </div>
            </div>
        </section>

        <!-- Main Display: Rosters (Outside Admin Panel) -->
        <section id="rosters-container" style="margin-top: 30px;">
            <h2>Collegiate Teams & Rosters</h2>
            <div id="teams-grid" class="teams-grid"></div>
        </section>
    </div>

    <!-- Interactive Player Modal -->
    <div id="player-modal" class="modal-overlay hidden" onclick="closeModal(event)">
      <div class="modal-content card" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h2 id="modal-name">Player Name</h2>
          <button onclick="closeModal(event)" class="close-btn">&times;</button>
        </div>
        <div id="modal-body" class="modal-body">
          <!-- Injected via JS -->
        </div>
      </div>
    </div>

    <!-- Match History Modal -->
    <div id="match-modal" class="modal-overlay hidden" onclick="closeMatchModal(event)">
      <div class="modal-content card" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h2 id="match-modal-title">Match History</h2>
          <button onclick="closeMatchModal(event)" class="close-btn">&times;</button>
        </div>
        
        <div id="match-history-list" style="max-height: 250px; overflow-y: auto; margin-bottom: 20px; padding-right: 5px;">
          <!-- Match items injected via JS -->
        </div>
    
        <div style="border-top: 1px solid var(--border-color); padding-top: 15px;">
          <h3 id="match-form-title" style="font-size: 1rem; margin-bottom: 10px; color: var(--accent-gold);">⚔️ Log New Match</h3>
          <form id="addMatchForm" onsubmit="saveMatchLog(event)" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <input type="hidden" id="match-team-id">
            <input type="hidden" id="match-log-id"> <!-- Used to track if we are editing -->
            
            <input type="date" id="match-date" required style="background: var(--bg-input); color: #fff; border: 1px solid var(--border-color); padding: 8px; border-radius: 6px;">
            <select id="match-type" required style="background: var(--bg-input); color: #fff; border: 1px solid var(--border-color); padding: 8px; border-radius: 6px;">
              <option value="Scrim">Scrim</option>
              <option value="Official">Official Match</option>
            </select>
            <input type="text" id="match-league" placeholder="League/Tournament (Optional)" style="grid-column: span 2; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-input); color: #fff;">
            
            <select id="match-result" required style="background: var(--bg-input); color: #fff; border: 1px solid var(--border-color); padding: 8px; border-radius: 6px;">
              <option value="W">Win (Series)</option>
              <option value="L">Loss (Series)</option>
            </select>
            <input type="text" id="match-score" placeholder="Game Score (e.g. 3-1)" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-input); color: #fff;">
            
            <div style="grid-column: span 2; display: flex; gap: 10px;">
              <button type="submit" id="match-submit-btn" class="btn" style="flex: 1; background: var(--accent-blue);">Save Match Log</button>
              <button type="button" id="match-cancel-btn" class="btn hidden" onclick="resetMatchForm()" style="background: #555;">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
