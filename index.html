<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collegiate RL Roster DB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Collegiate RL Scouting Database</h1>
            
            <!-- URL Input Section -->
            <div class="search-section">
                <input type="text" id="player-url" placeholder="Paste RL Tracker URL here...">
                <button onclick="fetchPlayerData()">Add Player to DB</button>
            </div>
        </header>

        <!-- Filters -->
        <div class="filters">
            <input type="text" id="search-team" placeholder="Filter by University/Team..." onkeyup="filterRosters()">
        </div>

        <!-- Roster Display Grid -->
        <main id="roster-grid">
            <!-- Player cards will be injected here by JavaScript -->
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
