<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OU Esports - Collegiate RL Roster & Scouting DB</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <!-- Top Navigation & Auth -->
        <header>
            <div class="header-top">
                <h1>OU Esports - RL Scouting Database</h1>
                <div class="admin-auth">
                    <span id="admin-status">Mode: Public Viewer</span>
                    <button id="auth-btn" onclick="toggleAuthModal()">Admin Login</button>
                </div>
            </div>

            <!-- Global Search & Filters -->
            <div class="filters">
                <input type="text" id="search-input" placeholder="Search by School, Player Name, or Alias..." onkeyup="renderAll()">
            </div>
        </header>

        <!-- Login Modal / Form -->
        <div id="login-modal" class="card hidden">
            <h3>Admin Login</h3>
            <div style="display: flex; gap: 10px; margin-top: 10px; align-items: center;">
                <input type="text" id="admin-email" placeholder="Username / Email">
                <input type="password" id="admin-password" placeholder="Password">
                <button onclick="loginAdmin()">Sign In</button>
                <button onclick="toggleAuthModal()" style="background-color: #555;">Cancel</button>
            </div>
        </div>

        <!-- Admin Controls Panel -->
        <section id="admin-panel" class="card admin-only hidden">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Admin Management Panel</h2>
                <button onclick="refreshAllPlayers()" style="background-color: #ff9800; color: black;">&#128257; Refresh All Rosters</button>
            </div>
            
            <div class="form-grid">
                <!-- Add Team Form -->
                <div class="form-box">
                    <h3>Add / Edit Team</h3>
                    <input type="text" id="team-name-input" placeholder="School / Team Name (e.g. UT Austin)">
                    <label style="font-size: 0.85rem; color: #9ba3b4; margin-top: 5px;">Upload Team Logo:</label>
                    <input type="file" id="team-logo-file" accept="image/*">
                    <button onclick="saveTeam()">Save Team</button>
                </div>

                <!-- Add Player Card -->
                <div class="card">
                  <h3>Add Player to Roster</h3>
                
                  <!-- Mode Toggle Tabs -->
                  <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <button type="button" id="tabAutoBtn" class="btn active" style="flex: 1;" onclick="switchPlayerTab('auto')">Auto (Tracker Link)</button>
                    <button type="button" id="tabManualBtn" class="btn" style="flex: 1;" onclick="switchPlayerTab('manual')">Manual Entry</button>
                  </div>
                
                  <!-- AUTO FETCH FORM -->
                  <form id="addPlayerForm" onsubmit="event.preventDefault(); addPlayerFormSubmit();" style="display: flex; flex-direction: column; gap: 10px;">
                    <input type="url" id="player-url-input" placeholder="https://rocketleague.tracker.network/rocket-league/profile/steam/..." required />
                    <select id="player-team-select" required>
                      <option value="">Select Team...</option>
                    </select>
                    <input type="text" id="player-alias-input" placeholder="Tournament Alias (Optional)" />
                    <input type="text" id="player-notes-input" placeholder="Scouting Notes (Optional)" />
                    <button type="submit" class="btn btn-primary" style="margin-top: 5px;">Fetch & Add Player</button>
                  </form>
                
                  <!-- MANUAL ENTRY FORM -->
                  <form id="addPlayerManualForm" onsubmit="addPlayerManualSubmit(event);" style="display: none; flex-direction: column; gap: 10px;">
                    <input type="text" id="manualUsername" placeholder="Player GamerTag / Name" required />
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                      <select id="manualPlatformSelect" required>
                        <option value="epic">Epic Games</option>
                        <option value="steam">Steam</option>
                        <option value="xbl">Xbox</option>
                        <option value="psn">PlayStation</option>
                      </select>
                      <select id="manualTeamSelect" required>
                        <option value="">Select Team...</option>
                      </select>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                      <input type="number" id="manual1v1MMR" placeholder="1v1 MMR" />
                      <input type="number" id="manual2v2MMR" placeholder="2v2 MMR" />
                      <input type="number" id="manual3v3MMR" placeholder="3v3 MMR" />
                      <input type="number" id="manualPeakMMR" placeholder="Peak MMR" />
                    </div>
                
                    <input type="text" id="manualAlias" placeholder="Tournament Alias (Optional)" />
                    <input type="text" id="manualNotes" placeholder="Scouting Notes (Optional)" />
                    <button type="submit" class="btn btn-primary" style="margin-top: 5px;">Save Player Manually</button>
                  </form>
                </div>

        <!-- Main Display: Rosters -->
        <section id="rosters-container">
            <h2>Collegiate Teams & Rosters</h2>
            <div id="teams-grid"></div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
